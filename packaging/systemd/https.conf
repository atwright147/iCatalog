# Optional icatalog.service.d/https.conf; install certificate/key files first.
# Choose the intended NAS interface and permit only trusted clients in its firewall.
[Service]
ExecStart=
ExecStart=/usr/local/bin/icatalog serve /var/lib/icatalog/catalogue.icatalog --bind 0.0.0.0 --port 8443 --token-file /etc/icatalog/sync.token --tls-cert /etc/icatalog/server-chain.pem --tls-key /etc/icatalog/server-key.pem
