name: UI checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  headless-and-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WGPU_BACKEND: vulkan
      UPDATE_SNAPSHOTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native build and software-rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libvulkan1 mesa-vulkan-drivers
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1
      - name: Add Task to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task ci
      - run: task ui:visual
      - name: Upload screenshot comparison evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-differences
          path: |
            crates/icatalog-ui/tests/snapshots/**/*.new.png
            crates/icatalog-ui/tests/snapshots/**/*.diff.png
          if-no-files-found: ignore
