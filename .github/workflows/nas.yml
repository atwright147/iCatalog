name: NAS static CLI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      tooling_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Record service support in the pinned application source
        id: service-feature
        run: |
          if git cat-file -e HEAD:packaging/systemd/icatalog.service 2>/dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Use corrected release tooling for recovery builds
        if: inputs.tooling_ref != ''
        env:
          WORKFLOW_SHA: ${{ inputs.tooling_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          git restore --source=FETCH_HEAD -- packaging Taskfile.yml
      - name: Install native musl compiler and ELF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils
          rustup target add "$RUST_TARGET"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.10'
          cache: false
      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task nas:build -- "$RUST_TARGET"
      - run: task release:package -- "$RUST_TARGET"
      - run: task nas:test -- "$RUST_TARGET"
      - name: Verify isolated systemd service lifecycle
        # Older recovery tags predate authentication/service support. Never skip
        # this check on normal builds, including if the source loses the unit.
        if: inputs.tooling_ref == '' || steps.service-feature.outputs.present == 'true'
        run: task nas:service:test -- "target/$RUST_TARGET/release/icatalog"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 14
