name: NAS container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native musl compiler and ELF tools
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils
          rustup target add "$RUST_TARGET"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.10'
          cache: false
      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the native static CLI
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: task nas:build -- "$RUST_TARGET"
      - name: Build the local image without publication
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: task docker:build -- "$RUST_TARGET" icatalog:test
      - name: Validate the Compose configuration
        env:
          ICATALOG_CATALOGUE_DIR: /tmp/icatalog-compose-catalogue
          ICATALOG_MEDIA_DIR: /tmp/icatalog-compose-media
        run: docker compose -f packaging/docker/compose.yml config --quiet
      - run: task docker:test -- icatalog:test
        env:
          ICATALOG_TEST_COMPOSE: '1'
