name: Release builds

on:
  release:
    types: [published]
  # Build the selected ref and keep artifacts, without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check binary versions and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            bash packaging/version.sh "$RELEASE_TAG"
          else
            bash packaging/version.sh
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: macos-14
            target: aarch64-apple-darwin
          # glibc 2.35 baseline, compatible with Debian 12+ and current Fedora/Arch.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev ruby-dev rpm libarchive-tools zstd
          sudo gem install fpm --version 1.17.0 --no-document
      - name: Use the repository Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "$RUST_TARGET"
      - name: Link the MSVC runtime statically
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Install Task
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test CLI and archive packaging
        shell: bash
        run: cargo test --locked -p icatalog-cli --target "$RUST_TARGET"
      - name: Build CLI and desktop app
        shell: bash
        run: task release:build -- --target "$RUST_TARGET"
      - name: Package binaries
        shell: bash
        run: task release:package -- "$RUST_TARGET"
      - name: Test extracted Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path target/release-assets/*.zip -DestinationPath target/release-check
          & target/release-check/icatalog.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed to start' }
          & target/release-check/icatalog.exe init target/release-check/smoke.sqlite
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed to create a catalogue' }
          & target/release-check/icatalog.exe open target/release-check/smoke.sqlite
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed to reopen a catalogue' }
          if (!(Test-Path target/release-check/icatalog-ui.exe)) { throw 'Desktop app missing' }
      - name: Test extracted macOS archive
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/release-check
          tar -xzf target/release-assets/*.tar.gz -C target/release-check
          test "$(lipo -archs target/release-check/iCatalog.app/Contents/MacOS/icatalog-ui)" = arm64
          codesign --verify --strict target/release-check/iCatalog.app
          target/release-check/icatalog --version
          target/release-check/icatalog init target/release-check/smoke.sqlite
          target/release-check/icatalog open target/release-check/smoke.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 14

  linux-install:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            format: deb
          - image: fedora:43
            format: rpm
          - image: archlinux:base
            format: arch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-x86_64-unknown-linux-gnu
          path: target/release-assets
      - name: Install and test native package in a clean distribution
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "$IMAGE" bash packaging/test-linux-install.sh "$FORMAT"

  publish:
    if: github.event_name == 'release'
    needs: [build, linux-install]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Generate checksums and attach all six packages to the existing release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum -- * > SHA256SUMS
          gh release upload "$RELEASE_TAG" --clobber -- *
