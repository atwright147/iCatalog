version: "3"

env:
  CARGO_TERM_COLOR: always

tasks:
  # Workspace
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  check:
    desc: Type-check the whole workspace
    cmds:
      - cargo check --workspace --all-targets

  build:
    desc: Build the whole workspace
    aliases: [b]
    cmds:
      - cargo build --workspace

  test:
    desc: Run all workspace tests
    aliases: [t]
    cmds:
      - cargo test --workspace

  fmt:
    desc: Format all code
    aliases: [format]
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting without changing files
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run clippy with warnings denied
    aliases: [clippy]
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  layers:
    desc: Run the crate layer-rule test
    cmds:
      - cargo test -p icatalog-cli --test layers

  ci:
    desc: "Full gate: fmt:check, lint, test, test:http"
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
      - task: test:http

  doc:
    desc: Build API docs (including private items)
    cmds:
      - cargo doc --workspace --no-deps --document-private-items

  clean:
    desc: Remove build artefacts
    cmds:
      - cargo clean

  # CLI
  cli:run:
    desc: Run the icatalog CLI (e.g. `task cli:run -- collection my.sqlite set-rules --id 1 --name Favourites --min-rating 2 --max-rating 4`)
    cmds:
      - cargo run -q -p icatalog-cli -- {{.CLI_ARGS}}

  cli:clone:
    desc: Clone a server catalogue into a new local file (e.g. -- local.sqlite --url http://nas:8080)
    cmds:
      - cargo run -q -p icatalog-cli -- clone {{.CLI_ARGS}}

  cli:previews:
    desc: Generate/manage previews (e.g. -- photos.sqlite generate; status/external/embed also available)
    cmds:
      - cargo run -q -p icatalog-cli -- previews {{.CLI_ARGS}}

  cli:preview:
    desc: Verify a stored preview and print its details (e.g. -- photos.icatalog --id 1)
    cmds:
      - cargo run -q -p icatalog-cli -- preview {{.CLI_ARGS}}

  # Desktop UI
  ui:run:
    desc: Run the icatalog-ui desktop shell (e.g. `task ui:run -- my.sqlite`)
    cmds:
      - cargo run -q -p icatalog-ui -- {{.CLI_ARGS}}

  ui:test:
    desc: Headless UI interaction, persistence, viewport and HTTP sync tests (localhost access; also in task ci)
    cmds:
      - cargo test -p icatalog-ui

  ui:visual:
    desc: Compare deterministic UI screenshots against reviewed baselines
    cmds:
      - env UPDATE_SNAPSHOTS=false cargo test -p icatalog-ui --bin icatalog-ui ui_tests::visual_snapshots -- --ignored --nocapture

  ui:visual:update:
    desc: Regenerate UI screenshot baselines for explicit visual review
    cmds:
      - env UPDATE_SNAPSHOTS=true cargo test -p icatalog-ui --bin icatalog-ui ui_tests::visual_snapshots -- --ignored --nocapture

  ui:smoke:
    desc: Native macOS menus, picker cancellation, rescan and Command-Q (requires desktop permissions)
    preconditions:
      - sh: 'test "$(uname -s)" = Darwin'
        msg: Native UI smoke tests require a logged-in macOS desktop
    cmds:
      - cargo test -p icatalog-ui --test native_smoke -- --ignored --nocapture --test-threads=1

  # Focused crate and scale tests
  test:catalog:
    desc: Test the icatalog-catalog crate
    cmds:
      - cargo test -p icatalog-catalog

  test:media:
    desc: Test the icatalog-media crate
    cmds:
      - cargo test -p icatalog-media

  test:engine:
    desc: Test the icatalog-engine crate
    cmds:
      - cargo test -p icatalog-engine

  test:sync:
    desc: Test sync, authentication, TLS and recovery with disposable local servers
    cmds:
      - cargo test -p icatalog-sync

  test:http:
    desc: Test the patched HTTP dependency's bounded readers, TLS parsing and early rejection
    cmds:
      - cargo test --manifest-path vendor/tiny_http/Cargo.toml --locked --features ssl-rustls --lib
      - cargo test --manifest-path vendor/tiny_http/Cargo.toml --locked --features ssl-rustls --test early-rejection

  test:scale:
    desc: Validate 10,000 generated images, catalogue pulls and annotation-delta sync
    cmds:
      - cargo test -p icatalog-engine --test scale -- --ignored --nocapture
      - cargo test -p icatalog-sync --test sync large_snapshot_round_trip -- --ignored --nocapture

  # Release and deployment
  release:build:
    desc: Build the release CLI and desktop app (e.g. -- --target aarch64-apple-darwin)
    cmds:
      - cargo build --locked --release -p icatalog-cli -p icatalog-ui {{.CLI_ARGS}}

  release:package:
    desc: Package release binaries for the supplied Rust target into target/release-assets
    cmds:
      - cmd: bash packaging/package-unix.sh {{.CLI_ARGS}}
        platforms: [darwin, linux]
      - cmd: pwsh -NoProfile -File packaging/package-windows.ps1 -Target {{.CLI_ARGS}}
        platforms: [windows]

  release:test:
    desc: Test release versions, archives, package metadata and NAS service commands
    cmds:
      - cargo test --locked -p icatalog-cli --test release_packaging
      - cargo test --locked -p icatalog-cli --test nas_service

  nas:build:
    desc: Build a static release CLI on native Linux (e.g. -- aarch64-unknown-linux-musl)
    cmds:
      - bash packaging/build-nas.sh build {{.CLI_ARGS}}

  nas:test:
    desc: Run native musl CLI and sync/TLS tests and verify the NAS archive
    cmds:
      - bash packaging/build-nas.sh test {{.CLI_ARGS}}
      - bash packaging/test-nas.sh {{.CLI_ARGS}}

  nas:service:test:
    desc: Verify systemd lifecycle on a disposable Linux host (sudo; pass built native CLI path)
    cmds:
      - sudo bash packaging/systemd/test.sh {{.CLI_ARGS}}

  docker:build:
    desc: Package an existing static NAS CLI as a local container image (e.g. -- aarch64-unknown-linux-musl icatalog:local)
    cmds:
      - bash packaging/docker/build.sh {{.CLI_ARGS}}

  docker:test:
    desc: Test container persistence, permissions, previews and clone/edit/sync with disposable data (e.g. -- icatalog:local)
    cmds:
      - bash packaging/docker/test.sh {{.CLI_ARGS}}
