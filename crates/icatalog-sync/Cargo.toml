[package]
name = "icatalog-sync"
version = "0.1.0"
edition = "2021"
description = "iCatalog HTTP sync service and client"
license = "MIT"

[dependencies]
icatalog-catalog = { path = "../icatalog-catalog" }
icatalog-engine = { path = "../icatalog-engine" }
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
subtle = "2"
url = "2"
webpki-roots = "0.26"
zeroize = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
