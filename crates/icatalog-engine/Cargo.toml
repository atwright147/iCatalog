[package]
name = "icatalog-engine"
version = "0.1.0"
edition = "2021"
description = "iCatalog session context and command registry"
license = "MIT"

[dependencies]
icatalog-catalog = { path = "../icatalog-catalog" }
icatalog-media = { path = "../icatalog-media" }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
