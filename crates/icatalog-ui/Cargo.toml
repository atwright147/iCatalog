[package]
name = "icatalog-ui"
version = "0.1.0"
edition = "2021"
description = "iCatalog native egui desktop shell (desktop-only for now)"
license = "MIT"

[[bin]]
name = "icatalog-ui"
path = "src/main.rs"

[dependencies]
icatalog-catalog = { path = "../icatalog-catalog" }
icatalog-engine = { path = "../icatalog-engine" }
icatalog-media = { path = "../icatalog-media" }
eframe = "0.36"
rfd = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3"
