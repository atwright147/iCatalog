[package]
name = "icatalog-ui"
version = "0.2.0"
edition = "2021"
description = "iCatalog native egui desktop shell (desktop-only for now)"
license = "MIT"

[[bin]]
name = "icatalog-ui"
path = "src/main.rs"

[dependencies]
icatalog-catalog = { path = "../icatalog-catalog" }
icatalog-engine = { path = "../icatalog-engine" }
icatalog-sync = { path = "../icatalog-sync" }
icatalog-media = { path = "../icatalog-media" }
eframe = "0.36"
rfd = "0.17"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = "=0.1.0"
muda = "0.21.2"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "unstable-locales"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Globalization_DateTimeFormatting"] }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "unstable-locales"] }
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3"
